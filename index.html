<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INVESTCOM | Market Pulse</title>
  <meta name="description" content="INVESTCOM Market Pulse — mercado, dividendos, rankings, gráficos e alertas em um só lugar." />
  <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)" />
  <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin />
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap)" rel="stylesheet" />
  <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js)"></script>
  <style>
    :root {
      --bg: #0b0f14;
      --bg-elevated: #121820;
      --bg-card: #161d27;
      --bg-hover: #1c2533;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #e8eef7;
      --text-muted: #8b9bb0;
      --text-dim: #5c6b7e;
      --accent: #3d9cf0;
      --accent-soft: rgba(61, 156, 240, 0.15);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.14);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.14);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --purple: #a78bfa;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      --nav-h: 64px;
      --font: "DM Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --max: 1200px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(61, 156, 240, 0.12), transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(167, 139, 250, 0.08), transparent 45%),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(34, 197, 94, 0.05), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; border: none; background: none; }
    ul { list-style: none; }
    img { max-width: 100%; display: block; }

    .wrap {
      width: min(100% - 2rem, var(--max));
      margin-inline: auto;
      position: relative;
      z-index: 1;
    }

    /* NAV */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      backdrop-filter: blur(16px);
      background: rgba(11, 15, 20, 0.82);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3d9cf0, #6366f1);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: -0.02em;
      box-shadow: 0 4px 16px rgba(61, 156, 240, 0.35);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .logo-text strong {
      font-size: 1rem;
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .logo-text span {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .nav-links a {
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: color 0.15s, background 0.15s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: var(--bg-hover);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      min-width: 220px;
      transition: border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      outline: none;
      font-size: 0.875rem;
    }

    .search-box input::placeholder { color: var(--text-dim); }

    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      max-height: 280px;
      overflow-y: auto;
      display: none;
      z-index: 50;
    }

    .search-results.open { display: block; }

    .search-item {
      width: 100%;
      text-align: left;
      padding: 0.7rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: var(--bg-hover); }

    .search-item .ticker {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
    }

    .search-item .name {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--green);
      background: var(--green-soft);
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.6s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .menu-btn {
      display: none;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      cursor: pointer;
    }

    .menu-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      position: relative;
    }

    .menu-btn span::before,
    .menu-btn span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 18px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
    }

    .menu-btn span::before { top: -6px; }
    .menu-btn span::after { top: 6px; }

    /* HERO / TICKER */
    .hero {
      padding: 2rem 0 1.25rem;
    }

    .hero-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #3d9cf0, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      max-width: 480px;
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .updated {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .indices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .index-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1rem;
      transition: border-color 0.15s, transform 0.15s;
    }

    .index-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .index-card .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
    }

    .index-card .value {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 500;
    }

    .index-card .chg {
      font-size: 0.8rem;
      font-family: var(--mono);
      margin-top: 0.15rem;
    }

    .chg.up { color: var(--green); }
    .chg.down { color: var(--red); }

    .ticker-rail {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    }

    .ticker-track {
      display: flex;
      gap: 2rem;
      width: max-content;
      padding: 0.65rem 0;
      animation: marquee 40s linear infinite;
    }

    .ticker-track:hover { animation-play-state: paused; }

    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .tick-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      white-space: nowrap;
      font-family: var(--mono);
    }

    .tick-item .sym { color: var(--text-muted); font-weight: 500; }
    .tick-item .px { color: var(--text); }

    /* LAYOUT */
    main { padding-bottom: 3rem; }

    .section {
      margin-top: 1.75rem;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }

    .section-head h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-head h2 .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      background: var(--accent-soft);
    }

    .section-head .hint {
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .grid-main {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      font-size: 0.68rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge-green { background: var(--green-soft); color: var(--green); }
    .badge-red { background: var(--red-soft); color: var(--red); }
    .badge-amber { background: var(--amber-soft); color: var(--amber); }
    .badge-blue { background: var(--accent-soft); color: var(--accent); }

    /* TABLES */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th {
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      font-weight: 600;
      padding: 0.4rem 0.5rem 0.65rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tbody tr {
      transition: background 0.12s;
      cursor: pointer;
    }

    tbody tr:hover { background: var(--bg-hover); }

    .sym-cell {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .sym-cell strong {
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .sym-cell small {
      color: var(--text-dim);
      font-size: 0.72rem;
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mono { font-family: var(--mono); font-size: 0.82rem; }

    .bar-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 90px;
    }

    .bar {
      height: 4px;
      border-radius: 2px;
      flex: 1;
      background: var(--bg-hover);
      overflow: hidden;
      max-width: 60px;
    }

    .bar > i {
      display: block;
      height: 100%;
      border-radius: 2px;
    }

    .bar > i.up { background: var(--green); }
    .bar > i.down { background: var(--red); }

    /* CHART */
    .chart-box {
      position: relative;
      height: 260px;
    }

    .chart-controls {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .chip {
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.12s;
    }

    .chip:hover { border-color: var(--border-strong); color: var(--text); }
    .chip.active {
      background: var(--accent-soft);
      border-color: transparent;
      color: var(--accent);
    }

    /* NEWS */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .news-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      transition: border-color 0.15s;
    }

    .news-item:hover { border-color: var(--border-strong); }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }

    .news-meta time {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .news-item h3 {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
    }

    .news-item p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .ai-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--purple);
      background: rgba(167, 139, 250, 0.15);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    /* ALERTS */
    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .alert-item {
      display: flex;
      gap: 0.75rem;
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .alert-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .alert-icon.opp { background: var(--green-soft); }
    .alert-icon.warn { background: var(--amber-soft); }
    .alert-icon.info { background: var(--accent-soft); }

    .alert-body strong {
      display: block;
      font-size: 0.88rem;
      margin-bottom: 0.2rem;
    }

    .alert-body p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* TRENDS */
    .trend-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .trend-card {
      padding: 0.9rem;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .trend-card .t-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .trend-card .t-value {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .trend-card .t-desc {
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    /* RANK */
    .rank-num {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      width: 1.5rem;
      display: inline-block;
    }

    .rank-num.top { color: var(--amber); font-weight: 600; }

    /* DIVIDEND YIELD */
    .yield {
      font-family: var(--mono);
      font-weight: 500;
      color: var(--green);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      width: min(100%, 440px);
      padding: 1.35rem;
      box-shadow: var(--shadow);
      animation: pop 0.2s ease;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .modal-head h3 {
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .modal-head .sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--text-muted);
      border: 1px solid var(--border);
      transition: background 0.12s;
    }

    .modal-close:hover { background: var(--bg-hover); color: var(--text); }

    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .modal-stat {
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      border: 1px solid var(--border);
    }

    .modal-stat label {
      display: block;
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.2rem;
    }

    .modal-stat span {
      font-family: var(--mono);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .modal-chart {
      height: 140px;
      margin-bottom: 0.5rem;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.75rem 0 2rem;
      margin-top: 1rem;
      position: relative;
      z-index: 1;
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
    }

    footer p {
      font-size: 0.8rem;
      color: var(--text-dim);
      max-width: 520px;
    }

    footer .brand {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* MOBILE NAV */
    .mobile-nav {
      display: none;
      position: fixed;
      inset: var(--nav-h) 0 0 0;
      background: rgba(11, 15, 20, 0.97);
      z-index: 90;
      padding: 1.25rem;
      flex-direction: column;
      gap: 0.5rem;
    }

    .mobile-nav.open { display: flex; }

    .mobile-nav a {
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);

    @media (max-width: 960px) {

    }

      .trend-grid { grid-template-columns: 1fr; }
      .chart-box { height: 220px; }
      .hero { padding-top: 1.25rem; }
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 300;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      font-size: 0.85rem;
      max-width: 300px;
      transform: translateY(120%);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast strong { color: var(--amber); }
